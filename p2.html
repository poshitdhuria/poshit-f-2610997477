<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1 {
  float: left;
  padding: 10px;
  border: 5px solid green;
}

.div2 {
  padding: 10px;
  border: 3px solid red;
  width: 200px;  clear: left;
  
}
    </style>
</head>
<body>
    <div class="div1">div1</div>
    <div class="div2">div2 - Notice that div2 is after div1 in the HTML code. However, since div2 has no clear, the text in div2 floats around div1.</div>
</body>
</html>
