<body style="margin:0;">

    <!-- Row 1: Header (20%) -->

                <p><a href="data:text/html,<h3>Home</h3><p>Welcome to Explore the World. Choose a destination or a package and start your journey!</p>" target="destinations">HOME</a></p>

            <td width="45%" bgcolor="lightblue" style="border:1px solid gray;">

        </tr>
