<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Course Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f4f8;
    }
    form {
      width: 350px;
      margin: 40px auto;
      padding: 20px;
      background-color: white;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
    }
    h2 {
      text-align: center;
      color: #1f3864;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background-color: #1f3864;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <form action="#" method="post">
    <h2>Online Course Registration Form</h2>

    <!-- Task 1: Student details -->
    <label for="name">Student Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="mobile">Mobile Number</label>
    <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number"
           pattern="[0-9]{10}" title="Please enter a 10-digit mobile number" required>

    <!-- Task 2: Course drop-down -->
    <label for="course">Select Course</label>
    <select id="course" name="course" required>
      <option value="">-- Select a course --</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
    </select>

    <button type="submit">Register</button>
  </form>

</body>
</html>
